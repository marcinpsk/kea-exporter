# Structural markdown rules only. Prose here is written one sentence per line
# or in long lines, so line-length and style-of-emphasis rules are off.
config:
  MD013: false # line-length: prose is not hard-wrapped in this repo
  MD033: false # inline HTML: used for details/summary blocks
  MD041: false # first line need not be a top-level heading

ignores:
  - CHANGELOG.md # generated by python-semantic-release
