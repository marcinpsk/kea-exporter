name: Docker

"on":
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to the Container registry
        if: inputs.tag != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ inputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'

      - name: Build ${{ matrix.distro }} ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Upload untagged release images. Publish tags only after all image checks pass.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ inputs.tag != '' }}
          cache-from: type=gha,scope=docker-${{ matrix.distro }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.distro }}-${{ matrix.arch }}

      - name: Test ${{ matrix.distro }} ${{ matrix.arch }} image
        env:
          KEA_EXPORTER_TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          KEA_EXPORTER_TEST_PLATFORM: linux/${{ matrix.arch }}
        run: uv run --frozen -- pytest -q tests/test_docker.py

      - name: Export the tested image digest
        id: digest
        if: inputs.tag != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the tested image digest
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    needs: build-and-push-image
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distro: [alpine, debian]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digests-${{ matrix.distro }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,suffix=-${{ matrix.distro }}
            type=semver,pattern={{version}}-${{ matrix.distro }},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.distro }},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest-${{ matrix.distro }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' && matrix.distro == 'debian' }}

      - name: Publish the multi-platform image
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "$tag")
          done
          for arch in amd64 arm64; do
            read -r digest < "$DIGEST_DIR/$arch"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            arguments+=("$REGISTRY/$IMAGE_NAME@$digest")
          done
          docker buildx imagetools create "${arguments[@]}"
