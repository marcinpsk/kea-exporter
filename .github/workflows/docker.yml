name: Docker

"on":
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [alpine, debian]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to the Container registry
        if: inputs.tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,suffix=-${{ matrix.distro }}
            type=semver,pattern={{version}}-${{ matrix.distro }},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.distro }},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest-${{ matrix.distro }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' && matrix.distro == 'debian' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build ${{ matrix.distro }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.tag != '' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
