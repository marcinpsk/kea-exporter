name: Build and publish to PyPi
on:
  push:
    tags: ["*"]
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to publish'
        required: false
        type: string

permissions: {}

jobs:
  pypi-publish:
    if: github.repository == 'mweinelt/kea-exporter'
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # This job publishes to PyPI, so never let a restored cache reach the
          # build. setup-uv's "auto" already skips the cache on tag pushes, but
          # this workflow is also reachable via workflow_call.
          enable-cache: false
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        run: uv publish
